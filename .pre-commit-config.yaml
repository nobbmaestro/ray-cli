fail_fast: true
repos:
  - repo: local
    hooks:
      - id: format
        name: format
        entry: ruff format
        language: system
        types: [python]
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry:  flake8
        language: system
        types: [python]
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        require_serial: true
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck
        entry: ty check
        language: system
        types: [python]
