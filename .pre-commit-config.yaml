repos:
  - repo: local
    hooks:
      - id: format
        name: format
        entry: ruff format
        language: system
        types: [python]
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: ruff check
        language: system
        types: [python]
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck
        entry: ty check
        language: system
        types: [python]
