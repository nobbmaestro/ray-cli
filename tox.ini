[tox]
envlist = python3.8, python3.9, python3.10, python3.11, lint

[gh-actions]
python =
    3.8: python3.8
    3.9: python3.9
    3.10: python3.10
    3.11: python3.11, lint

[testenv]
deps =
    pytest
    pre-commit
commands =
    pytest

[testenv:lint]
description = Run linters via pre-commit
skip_install = true
deps = pre-commit
commands =
    pre-commit run --all-files --show-diff-on-failure
